name: Publish

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

# npm's trusted publisher for this package names this file and accepts the
# OIDC token from id-token, so renaming the file stops publishing.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # A manual run can pick any branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Skip a version npm already has
        id: check
        run: |
          spec=$(jq -r '"\(.name)@\(.version)"' package.json)
          if npm view "$spec" version; then
            echo "$spec is already on npm"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.publish == 'true'
        run: |
          pnpm dlx publint@0.3.25
          pnpm dlx @arethetypeswrong/cli@0.18.5 --pack . --profile esm-only
      - if: steps.check.outputs.publish == 'true'
        run: npm publish
